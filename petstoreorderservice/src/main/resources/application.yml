springfoxdocumentation:
  swagger:
    v2:
      path: /api-docs
      
server:
  port: ${PETSTOREORDERSERVICE_SERVER_PORT:8080}

petstore:
  service:
    product:
      url: ${PETSTOREPRODUCTSERVICE_URL:http://localhost:8082}
    reserver:
      url: ${PETSTOREORDERITEMSRESERVER_URL:http://localhost:8083}

spring:
  application:
    name: petstoreorderservice
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    azure:
#      keyvault:
#        secret:
#          property-sources[0]:
#            endpoint: https://modulefinalpetstore-kv.vault.azure.net/
#          credential:
#            managed-identity-enabled: true
      cosmos:
        database: petstore
        endpoint: ${COSMOSDB}
        key: ${COSMOSTOKEN}
      servicebus:
        url: ${QUEUEURL}
        queue: ${QUEUENAME:reservations}

management:
  endpoints:
    web:
      exposure:
        include: "*"       
  trace:
    http:
      enabled: true 
  endpoint:
    httptrace:
      enabled: true
